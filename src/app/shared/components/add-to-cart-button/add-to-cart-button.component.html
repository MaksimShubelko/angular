<div>
<div *ngIf="!isClicked; else select_products_count">
    <button (click)="handleClick()" [disabled]="isDisabled()" class="button">Add to Cart</button>
</div>
<ng-template #select_products_count>
    <button (click)="decreaseProductQty()" [disabled]="isMinQty()" class="button button-row">↓</button>
    <input [value]="addedProducts" class="product-count">
    <button (click)="increaseProductQty()" [disabled]="isMaxQty()" class="button button-row">↑</button>
</ng-template>
</div>
