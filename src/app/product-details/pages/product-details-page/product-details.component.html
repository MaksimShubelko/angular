<body>
<app-header></app-header>
<div class="product-container">
    <app-product-image [imageUrl]="product.image"></app-product-image>
    <div class="product-details">
        <app-product-title [productTitle]="product.title"></app-product-title>
        <div class="product-rating">
            <div>{{ product.rating.rate }}</div>
            <div class="reviews">({{ reviews.length }}) Reviews</div>
        </div>
        <app-add-to-cart-button [isDisabledWhenOutOfStock]="true" [product]="product"></app-add-to-cart-button>
        <app-product-stock-availability [stock]="product.stock"></app-product-stock-availability>
        <div class="product-price">${{ product.price }}</div>
        <div class="product-description">
            <p>{{ product.description }}</p>
        </div>
    </div>
</div>
<app-product-reviews [reviews]="reviews"></app-product-reviews>
</body>
